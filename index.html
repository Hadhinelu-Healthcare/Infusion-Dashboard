<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DripStop IV Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root {
  --bg:#eef7fb; --card:#fff; --blue:#2f88a8; --accent:#59a3be;
  --green:#1ea672; --red:#e65b4e; --yellow:#f4b740;
  --text:#10202a; --muted:#70818a;
  --shadow:0 8px 30px rgba(0,0,0,0.06); --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}

/* ── TOP BAR ── */
.topbar{
  background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.06);
  padding:0 24px;height:60px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
}
.brand{font-size:22px;font-weight:800;color:var(--blue);}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* ── CONNECTION PILL ── */
.conn-pill{
  display:flex;align-items:center;gap:7px;padding:7px 16px;
  border-radius:20px;font-size:12px;font-weight:600;
  background:#fff;border:1.5px solid #d0e8f2;transition:all 0.3s;
}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pill-ok   {border-color:#b2edd4;color:var(--green);}
.pill-ok   .conn-dot{background:var(--green);animation:blink 1.6s infinite;}
.pill-wait {border-color:#b2d8ee;color:var(--blue);}
.pill-wait .conn-dot{background:var(--blue);animation:blink 0.5s infinite;}
.pill-err  {border-color:#f5c0bb;color:var(--red);}
.pill-err  .conn-dot{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── ICON BUTTONS ── */
.icon-btn{
  background:var(--bg);border:1.5px solid #d0e8f2;border-radius:10px;
  padding:7px 16px;font-size:13px;font-weight:600;color:var(--blue);
  cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;
}
.icon-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}

/* ── SUMMARY BAR ── */
.summary{
  display:flex;gap:12px;padding:16px 24px 0;flex-wrap:wrap;
}
.chip{
  background:#fff;border-radius:12px;box-shadow:var(--shadow);
  padding:10px 18px;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;
}
.chip-dot{width:10px;height:10px;border-radius:50%;}

/* ── DEVICE GRID ── */
.grid-wrap{padding:16px 24px 32px;}
.grid-hdr{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.grid-title{font-size:20px;font-weight:700;}
.add-btn{
  background:linear-gradient(90deg,var(--blue),var(--accent));
  color:#fff;border:none;border-radius:10px;padding:9px 20px;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;
}
.device-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}
.empty{
  grid-column:1/-1;text-align:center;padding:60px 20px;
  color:var(--muted);font-size:14px;
}
.empty b{display:block;font-size:20px;color:var(--blue);margin-bottom:8px;}

/* ── DEVICE CARD ── */
.device-card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;
  border:2px solid transparent;position:relative;overflow:hidden;
}
.device-card:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,0.10);}
.card-alarm   {border-color:var(--red);}
.card-running {border-color:#b2edd4;}
.card-offline {opacity:0.7;}
.card-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:14px;gap:8px;
}
.card-name{font-size:16px;font-weight:700;}
.card-id  {font-size:11px;color:var(--muted);margin-top:2px;}
.badge{
  font-size:10px;font-weight:700;padding:3px 10px;
  border-radius:20px;flex-shrink:0;white-space:nowrap;
}
.badge-ok     {background:#e6f7f0;color:var(--green);}
.badge-warn   {background:#fff8e6;color:var(--yellow);}
.badge-err    {background:#fdecea;color:var(--red);}
.badge-off    {background:#f0f0f0;color:var(--muted);}
.badge-calib  {background:#e6f2f7;color:var(--blue);}
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;margin-bottom:14px;
}
.metric-val{
  font-size:26px;font-weight:800;text-align:center;
  line-height:1;transition:color 0.3s;
}
.metric-lbl{
  font-size:10px;color:var(--muted);font-weight:600;
  text-align:center;margin-top:3px;text-transform:uppercase;
}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--muted);padding-top:10px;
  border-top:1px solid #eef2f5;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;margin-right:5px;
}

/* ── MODALS ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(16,32,42,0.4);
  display:none;align-items:center;justify-content:center;
  z-index:500;padding:16px;
}
.modal-bg.open{display:flex;}
.modal{
  background:#fff;border-radius:24px;
  box-shadow:0 24px 60px rgba(0,0,0,0.15);
  width:100%;max-height:90vh;overflow-y:auto;
}
.modal-hdr{
  padding:24px 28px 0;display:flex;align-items:center;
  justify-content:space-between;
}
.modal-title{font-size:20px;font-weight:800;}
.close-btn{
  background:var(--bg);border:none;border-radius:8px;
  width:32px;height:32px;cursor:pointer;font-size:18px;
  color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.close-btn:hover{background:#d0e8f2;color:var(--blue);}
.modal-body{padding:20px 28px 28px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:13px;font-weight:600;color:var(--muted);}
.field input{
  border:1.5px solid #d0e8f2;border-radius:10px;padding:10px 14px;
  font-family:'Inter',sans-serif;font-size:14px;color:var(--text);
  outline:none;background:var(--bg);transition:border-color 0.2s;
}
.field input:focus{border-color:var(--blue);}
.field-err{font-size:12px;color:var(--red);min-height:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn-primary{
  background:linear-gradient(90deg,var(--blue),var(--accent));
  color:#fff;border:none;border-radius:10px;padding:10px 24px;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
}
.btn-secondary{
  background:var(--bg);border:1.5px solid #d0e8f2;border-radius:10px;
  padding:10px 20px;font-family:'Inter',sans-serif;font-size:14px;
  font-weight:600;color:var(--muted);cursor:pointer;
}
.btn-danger{
  background:#fdecea;border:1.5px solid #f5c0bb;border-radius:10px;
  padding:10px 20px;font-family:'Inter',sans-serif;font-size:14px;
  font-weight:600;color:var(--red);cursor:pointer;margin-right:auto;
}

/* ── DETAIL MODAL ── */
.detail-metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;margin-bottom:18px;
}
.detail-metric{
  background:var(--bg);border-radius:14px;
  padding:16px;text-align:center;
}
.detail-val{
  font-size:40px;font-weight:800;line-height:1;transition:color 0.3s;
}
.detail-lbl{
  font-size:11px;color:var(--muted);font-weight:600;
  margin-top:6px;text-transform:uppercase;
}
.info-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin-bottom:18px;
}
.info-chip{background:var(--bg);border-radius:12px;padding:12px 16px;}
.info-chip-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:4px;}
.info-chip-val{font-size:16px;font-weight:700;}
.chart-box{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:16px;}
.chart-box-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.event-log{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.event-log::-webkit-scrollbar{width:3px;}
.event-log::-webkit-scrollbar-thumb{background:#d0e8f2;border-radius:2px;}
.log-item{
  background:#f5fbfe;border-left:4px solid var(--accent);
  padding:8px 12px;border-radius:8px;font-size:12px;
}
.log-item.log-ok   {border-color:var(--green);}
.log-item.log-warn {border-color:var(--yellow);background:#fffbf0;}
.log-item.log-err  {border-color:var(--red);background:#fff5f4;}
.log-time{font-size:10px;color:var(--muted);margin-bottom:2px;}

/* ── FOOTER ── */
.footer{
  padding:12px 24px;text-align:center;
  font-size:12px;color:var(--muted);
}

@media(max-width:700px){
  .detail-metrics{grid-template-columns:1fr 1fr;}
  .topbar{padding:0 14px;}
  .summary,.grid-wrap{padding-left:14px;padding-right:14px;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">DripStop IV Monitor</div>
  <div class="topbar-right">
    <div class="conn-pill pill-wait" id="connPill">
      <span class="conn-dot"></span>
      <span id="connText">Connecting…</span>
    </div>
    <button class="icon-btn" onclick="openAdd()">+ Add Device</button>
  </div>
</div>

<!-- SUMMARY -->
<div class="summary" id="summary"></div>

<!-- DEVICE GRID -->
<div class="grid-wrap">
  <div class="grid-hdr">
    <div class="grid-title">Devices &nbsp;<span id="devCount" style="color:var(--muted);font-weight:500;font-size:16px;"></span></div>
  </div>
  <div class="device-grid" id="grid">
    <div class="empty"><b>No devices yet</b>Click "+ Add Device" to register your first ESP32.</div>
  </div>
</div>

<div class="footer">DripStop IV Monitor · broker.emqx.io MQTT · Pico R15</div>

<!-- ADD / EDIT DEVICE MODAL -->
<div class="modal-bg" id="addModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-hdr">
      <div class="modal-title" id="addTitle">Add Device</div>
      <button class="close-btn" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Device ID <span style="color:var(--muted);font-weight:400;">(must match DEVICE_ID in ESP32 code)</span></label>
        <input id="fId" placeholder="e.g. DEVICE_01" oninput="this.value=this.value.toUpperCase().replace(/\s/g,'_')">
        <div class="field-err" id="fIdErr"></div>
      </div>
      <div class="field">
        <label>Patient Name</label>
        <input id="fName" placeholder="e.g. John Smith">
        <div class="field-err" id="fNameErr"></div>
      </div>
      <div class="field">
        <label>Bed / Room <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
        <input id="fBed" placeholder="e.g. Bed 4A">
      </div>
      <div class="modal-actions">
        <button class="btn-danger"     id="delBtn"  onclick="deleteDevice()" style="display:none;">Remove</button>
        <button class="btn-secondary"  onclick="closeModal('addModal')">Cancel</button>
        <button class="btn-primary"    onclick="saveDevice()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- DEVICE DETAIL MODAL -->
<div class="modal-bg" id="detailModal">
  <div class="modal" style="max-width:540px;">
    <div class="modal-hdr">
      <div>
        <div class="modal-title" id="dName">—</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px;" id="dMeta">—</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" style="font-size:12px;padding:6px 12px;" onclick="editCurrent()">Edit</button>
        <button class="close-btn" onclick="closeModal('detailModal')">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="detail-metrics">
        <div class="detail-metric">
          <div class="detail-val" id="dRate" style="color:var(--blue)">---</div>
          <div class="detail-lbl">Rate (dpm)</div>
        </div>
        <div class="detail-metric">
          <div class="detail-val" id="dSet" style="color:var(--muted)">---</div>
          <div class="detail-lbl">Set (dpm)</div>
        </div>
        <div class="detail-metric">
          <div class="detail-val" id="dTime" style="color:var(--green)">---</div>
          <div class="detail-lbl">Time left (min)</div>
        </div>
      </div>
      <div class="info-grid">
        <div class="info-chip">
          <div class="info-chip-lbl">Status</div>
          <div class="info-chip-val" id="dStatus" style="color:var(--muted)">---</div>
        </div>
        <div class="info-chip">
          <div class="info-chip-lbl">Alarm</div>
          <div class="info-chip-val" id="dAlarm" style="color:var(--green)">---</div>
        </div>
        <div class="info-chip">
          <div class="info-chip-lbl">Drop Factor</div>
          <div class="info-chip-val" id="dDF">--</div>
        </div>
        <div class="info-chip">
          <div class="info-chip-lbl">Last Update</div>
          <div class="info-chip-val" id="dLast" style="font-size:13px;">---</div>
        </div>
      </div>
      <div class="chart-box">
        <div class="chart-box-title">Rate Trend</div>
        <canvas id="dChart" height="80"></canvas>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Event Log</div>
      <div class="event-log" id="dLog"></div>
    </div>
  </div>
</div>

<script>
// ================================================================
// CONFIG
// ================================================================
const BROKER    = 'wss://broker.emqx.io:8084/mqtt';
const SUB_TOPIC = 'dripstop/+/telemetry';

// ================================================================
// STORAGE
// ================================================================
function getDevices() {
  try { return JSON.parse(localStorage.getItem('ds_devices') || '[]'); } catch { return []; }
}
function saveDevices(d) { localStorage.setItem('ds_devices', JSON.stringify(d)); }

// ================================================================
// LIVE DATA  — one entry per device ID
// ================================================================
const live = {};   // deviceId → { RATE, SET, TIME, ALARM, STATUS, DF, lastSeen, history[], log[] }

function getLive(id) {
  if (!live[id]) live[id] = {
    RATE:null, SET:null, TIME:null,
    ALARM:'NORMAL', STATUS:'IDLE', DF:'--',
    lastSeen:null, history:[], log:[]
  };
  return live[id];
}

// ================================================================
// PACKET PARSER
// Packet format: RATE=66,SET=70,TIME=24,ALARM=NORMAL,STATUS=RUNNING,DF=20
// ================================================================
function parsePacket(deviceId, line) {
  const t    = getLive(deviceId);
  const prev = { ALARM: t.ALARM, STATUS: t.STATUS };

  line.split(',').forEach(pair => {
    const eq = pair.indexOf('=');
    if (eq < 0) return;
    const k = pair.slice(0, eq).trim().toUpperCase();
    const v = pair.slice(eq + 1).trim();
    if (k === 'RATE' || k === 'SET' || k === 'TIME') {
      t[k] = (v === 'NOT_SET' || v === '') ? null : parseInt(v, 10);
    } else if (k === 'ALARM' || k === 'STATUS' || k === 'DF') {
      t[k] = v;
    }
  });

  t.lastSeen = new Date();
  if (t.RATE !== null) {
    t.history.push(t.RATE);
    if (t.history.length > 60) t.history.shift();
  }

  const now = new Date().toLocaleTimeString();
  if (prev.ALARM !== t.ALARM) {
    t.log.unshift({ time:now, msg:'Alarm → ' + t.ALARM,
      cls: t.ALARM === 'NORMAL' ? 'log-ok' : 'log-err' });
  }
  if (prev.STATUS !== t.STATUS) {
    t.log.unshift({ time:now, msg:'Status → ' + t.STATUS, cls:'log-ok' });
  }
  if (t.log.length > 40) t.log.pop();
}

// ================================================================
// MQTT
// ================================================================
let mqttClient = null;

function mqttConnect() {
  if (typeof mqtt === 'undefined') {
    setConn('err', 'MQTT library failed to load');
    return;
  }
  try {
    setConn('wait', 'Connecting…');
    const id = 'dripstop_dash_' + Math.random().toString(16).slice(2, 8);
    mqttClient = mqtt.connect(BROKER, { clientId:id, clean:true,
      reconnectPeriod:5000, connectTimeout:15000 });

    mqttClient.on('connect', () => {
      setConn('ok', 'Live · Connected');
      mqttClient.subscribe(SUB_TOPIC);
    });
    mqttClient.on('message', (topic, payload) => {
      const parts = topic.split('/');
      if (parts.length < 3) return;
      const deviceId = parts[1];
      const line     = payload.toString().trim();
      if (!line.includes('RATE=')) return;
      parsePacket(deviceId, line);
      renderCard(deviceId);
      renderSummary();
      if (detailOpen === deviceId) renderDetail(deviceId);
    });
    mqttClient.on('error',    e  => { setConn('err',  'MQTT Error');        console.error(e); });
    mqttClient.on('offline',  () =>   setConn('wait', 'Reconnecting…'));
    mqttClient.on('reconnect',() =>   setConn('wait', 'Reconnecting…'));
  } catch(e) {
    setConn('err', 'Connect failed');
    console.error(e);
  }
}

function setConn(state, text) {
  const pill = document.getElementById('connPill');
  const span = document.getElementById('connText');
  pill.className = 'conn-pill ' +
    (state === 'ok' ? 'pill-ok' : state === 'wait' ? 'pill-wait' : 'pill-err');
  span.textContent = text;
}

// ================================================================
// RENDER GRID
// ================================================================
function rateColor(rate, set) {
  if (rate === null || set === null) return 'var(--muted)';
  const diff = Math.abs(rate - set) / set;
  return diff < 0.05 ? 'var(--green)' : diff < 0.15 ? 'var(--blue)' : 'var(--red)';
}

function isOffline(t) {
  return !t.lastSeen || (Date.now() - t.lastSeen.getTime() > 15000);
}

function renderAllCards() {
  const devices = getDevices();
  document.getElementById('devCount').textContent = devices.length ? '(' + devices.length + ')' : '';
  const grid = document.getElementById('grid');
  if (!devices.length) {
    grid.innerHTML = '<div class="empty"><b>No devices yet</b>Click "+ Add Device" to register your first ESP32.</div>';
    renderSummary();
    return;
  }
  // Build HTML for all cards
  grid.innerHTML = devices.map(d => `
    <div class="device-card" id="card_${d.id}" onclick="openDetail('${d.id}')">
      <div class="card-head">
        <div>
          <div class="card-name">${d.name}</div>
          <div class="card-id">${d.id}${d.bed ? ' · ' + d.bed : ''}</div>
        </div>
        <span class="badge badge-off" id="badge_${d.id}">OFFLINE</span>
      </div>
      <div class="metrics">
        <div>
          <div class="metric-val" id="mR_${d.id}" style="color:var(--muted)">---</div>
          <div class="metric-lbl">Rate dpm</div>
        </div>
        <div>
          <div class="metric-val" id="mS_${d.id}" style="color:var(--muted)">---</div>
          <div class="metric-lbl">Set dpm</div>
        </div>
        <div>
          <div class="metric-val" id="mT_${d.id}" style="color:var(--muted)">---</div>
          <div class="metric-lbl">Min left</div>
        </div>
      </div>
      <div class="card-foot">
        <span>
          <span class="status-dot" id="sDot_${d.id}" style="background:var(--muted)"></span>
          <span id="sStat_${d.id}">Waiting…</span>
        </span>
        <span id="sTime_${d.id}"></span>
      </div>
    </div>`).join('');
  devices.forEach(d => renderCard(d.id));
  renderSummary();
}

function renderCard(id) {
  const t = getLive(id);
  const off = isOffline(t);

  // Card border class
  const card = document.getElementById('card_' + id);
  if (card) {
    card.className = 'device-card' +
      (off ? ' card-offline' :
       t.ALARM && t.ALARM !== 'NORMAL' ? ' card-alarm' :
       t.STATUS === 'RUNNING' ? ' card-running' : '');
  }

  // Badge
  const badge = document.getElementById('badge_' + id);
  if (badge) {
    if (off) { badge.className = 'badge badge-off'; badge.textContent = 'OFFLINE'; }
    else {
      const map = { NORMAL:'badge-ok', OCCLUSION:'badge-err', ERROR:'badge-err',
                    RECALIBRATE:'badge-warn', COMPLETE:'badge-ok' };
      badge.className = 'badge ' + (map[t.ALARM] || 'badge-ok');
      badge.textContent = t.ALARM || 'NORMAL';
    }
  }

  // Metrics
  const set = v => { const el = document.getElementById(v[0]+'_'+id); if(el){el.textContent=v[1];el.style.color=v[2]||'';} };
  set(['mR', t.RATE !== null ? t.RATE : '---', off ? 'var(--muted)' : rateColor(t.RATE, t.SET)]);
  set(['mS', t.SET  !== null ? t.SET  : '---', 'var(--blue)']);
  set(['mT', t.TIME !== null ? t.TIME : '---',
    t.TIME !== null && t.TIME < 10 ? 'var(--red)' : 'var(--green)']);

  // Status dot + text
  const statusColor = { RUNNING:'var(--green)', PAUSED:'var(--yellow)',
    CALIBRATING:'var(--blue)', COMPLETE:'var(--muted)', IDLE:'var(--muted)' };
  const dot  = document.getElementById('sDot_'  + id);
  const stat = document.getElementById('sStat_' + id);
  const tm   = document.getElementById('sTime_' + id);
  if (dot)  dot.style.background = off ? 'var(--muted)' : (statusColor[t.STATUS] || 'var(--muted)');
  if (stat) stat.textContent = off ? 'No signal' : (t.STATUS || 'IDLE');
  if (tm && t.lastSeen) tm.textContent = t.lastSeen.toLocaleTimeString();
}

function renderSummary() {
  const devices = getDevices();
  let running = 0, alarms = 0, offline = 0;
  devices.forEach(d => {
    const t = getLive(d.id);
    if (isOffline(t)) { offline++; return; }
    if (t.STATUS === 'RUNNING' || t.STATUS === 'CALIBRATING') running++;
    if (t.ALARM && t.ALARM !== 'NORMAL') alarms++;
  });
  document.getElementById('summary').innerHTML = `
    <div class="chip"><span class="chip-dot" style="background:var(--green)"></span>${running} Active</div>
    <div class="chip"><span class="chip-dot" style="background:var(--red)"></span>${alarms} Alarm${alarms!==1?'s':''}</div>
    <div class="chip"><span class="chip-dot" style="background:var(--muted)"></span>${offline} Offline</div>
    <div class="chip"><span class="chip-dot" style="background:var(--blue)"></span>${devices.length} Total</div>`;
}

// Refresh offline status every 5 seconds
setInterval(() => { getDevices().forEach(d => renderCard(d.id)); renderSummary(); }, 5000);

// ================================================================
// ADD / EDIT MODAL
// ================================================================
let editingId = null;

function openAdd(editId) {
  editingId = editId || null;
  document.getElementById('addTitle').textContent = editId ? 'Edit Device' : 'Add Device';
  document.getElementById('delBtn').style.display  = editId ? '' : 'none';
  document.getElementById('fIdErr').textContent   = '';
  document.getElementById('fNameErr').textContent = '';

  if (editId) {
    const d = getDevices().find(x => x.id === editId);
    if (d) {
      document.getElementById('fId').value   = d.id;
      document.getElementById('fName').value = d.name;
      document.getElementById('fBed').value  = d.bed || '';
    }
    document.getElementById('fId').disabled = true;
  } else {
    document.getElementById('fId').value   = '';
    document.getElementById('fName').value = '';
    document.getElementById('fBed').value  = '';
    document.getElementById('fId').disabled = false;
  }
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById(editId ? 'fName' : 'fId').focus(), 100);
}

function saveDevice() {
  const id   = document.getElementById('fId').value.trim();
  const name = document.getElementById('fName').value.trim();
  const bed  = document.getElementById('fBed').value.trim();
  let ok = true;
  document.getElementById('fIdErr').textContent   = '';
  document.getElementById('fNameErr').textContent = '';
  if (!id)   { document.getElementById('fIdErr').textContent   = 'Device ID is required.'; ok = false; }
  if (!name) { document.getElementById('fNameErr').textContent = 'Patient name is required.'; ok = false; }
  if (!ok) return;

  let devices = getDevices();
  if (editingId) {
    devices = devices.map(d => d.id === editingId ? {...d, name, bed} : d);
  } else {
    if (devices.find(d => d.id === id)) {
      document.getElementById('fIdErr').textContent = 'Device ID already exists.'; return;
    }
    devices.push({ id, name, bed });
  }
  saveDevices(devices);
  closeModal('addModal');
  renderAllCards();
}

function deleteDevice() {
  if (!editingId) return;
  if (!confirm('Remove ' + editingId + '?')) return;
  saveDevices(getDevices().filter(d => d.id !== editingId));
  delete live[editingId];
  closeModal('addModal');
  renderAllCards();
}

// ================================================================
// DETAIL MODAL
// ================================================================
let detailOpen   = null;
let detailChart  = null;

function openDetail(id) {
  detailOpen = id;
  const devices = getDevices();
  const d = devices.find(x => x.id === id);
  if (!d) return;
  document.getElementById('dName').textContent = d.name;
  document.getElementById('dMeta').textContent = id + (d.bed ? ' · ' + d.bed : '');

  // Rebuild chart
  if (detailChart) { detailChart.destroy(); detailChart = null; }
  const dc = document.getElementById('dChart').getContext('2d');
  detailChart = new Chart(dc, {
    type: 'line',
    data: { labels:[], datasets:[{ data:[], borderColor:'#2f88a8',
      backgroundColor:'rgba(47,136,168,0.1)', tension:0.35, fill:true,
      borderWidth:2, pointRadius:0 }]},
    options: { responsive:true, animation:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{display:false},
        y:{ min:0, grid:{color:'rgba(0,0,0,0.04)'},
            ticks:{color:'#70818a',font:{size:10},maxTicksLimit:4} }}}
  });

  renderDetail(id);
  document.getElementById('detailModal').classList.add('open');
}

function renderDetail(id) {
  const t = getLive(id);
  const set = (elId, val, col) => {
    const el = document.getElementById(elId);
    if (!el) return;
    el.textContent = val;
    if (col) el.style.color = col;
  };

  set('dRate', t.RATE !== null ? t.RATE : '---', rateColor(t.RATE, t.SET));
  set('dSet',  t.SET  !== null ? t.SET  : '---', 'var(--blue)');
  set('dTime', t.TIME !== null ? t.TIME : '---',
    t.TIME !== null && t.TIME < 10 ? 'var(--red)' : 'var(--green)');

  const sc = { RUNNING:'var(--green)', PAUSED:'var(--yellow)',
    CALIBRATING:'var(--blue)', COMPLETE:'var(--muted)', IDLE:'var(--muted)' };
  set('dStatus', t.STATUS || '---', sc[t.STATUS] || 'var(--muted)');

  const ac = { NORMAL:'var(--green)', OCCLUSION:'var(--red)',
    ERROR:'var(--red)', RECALIBRATE:'var(--blue)', COMPLETE:'var(--green)' };
  set('dAlarm',  t.ALARM  || '---',  ac[t.ALARM]  || 'var(--muted)');
  set('dDF',     t.DF && t.DF !== 'NOT_SET' ? t.DF : '--', null);
  set('dLast',   t.lastSeen ? t.lastSeen.toLocaleTimeString() : '---', null);

  if (detailChart && t.history.length) {
    detailChart.data.labels              = t.history.map(() => '');
    detailChart.data.datasets[0].data   = [...t.history];
    detailChart.update('none');
  }

  const logEl = document.getElementById('dLog');
  if (logEl) {
    logEl.innerHTML = t.log.length
      ? t.log.slice(0, 20).map(e =>
          `<div class="log-item ${e.cls}">
            <div class="log-time">${e.time}</div>${e.msg}
          </div>`).join('')
      : '<div style="font-size:13px;color:var(--muted);padding:8px;">No events yet.</div>';
  }
}

function editCurrent() {
  closeModal('detailModal');
  openAdd(detailOpen);
}

// ================================================================
// MODAL HELPERS
// ================================================================
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  if (id === 'detailModal') detailOpen = null;
  if (id === 'addModal') {
    editingId = null;
    document.getElementById('fId').disabled = false;
  }
}
document.querySelectorAll('.modal-bg').forEach(bg =>
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); })
);

// ================================================================
// BOOT — wait for window.onload so CDN scripts are guaranteed loaded
// ================================================================
window.onload = function() {
  renderAllCards();
  mqttConnect();
};
</script>
