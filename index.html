<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DripStop IV Monitor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#0f1923;
  --card:#162030;
  --card2:#1c2a3a;
  --blue:#3b9fd4;
  --green:#22c97a;
  --red:#f05252;
  --yellow:#f5a623;
  --text:#f0f4f8;
  --muted:#7a90a4;
  --border:#243044;
  --radius:20px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* TOP BAR */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  height:64px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.brand{
  font-size:20px;
  font-weight:800;
}

.brand span{
  color:var(--blue);
}

.conn-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  border-radius:20px;
  background:var(--card2);
  border:1px solid var(--border);
  font-size:12px;
  font-weight:700;
}

.conn-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.pill-ok{
  color:var(--green);
}

.pill-ok .conn-dot{
  background:var(--green);
}

.pill-err{
  color:var(--red);
}

.pill-err .conn-dot{
  background:var(--red);
}

/* SUMMARY */

.summary{
  display:flex;
  gap:12px;
  padding:20px 28px;
  flex-wrap:wrap;
}

.sum-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:12px;
}

.sum-val{
  font-size:24px;
  font-weight:800;
}

.sum-lbl{
  font-size:11px;
  color:var(--muted);
}

/* GRID */

.grid-wrap{
  padding:0 28px 40px;
}

.device-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:18px;
}

/* DEVICE CARD */

.device-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
}

.card-running{
  border-color:#1a5c3a;
}

.card-alarm{
  border-color:var(--red);
}

.card-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.card-name{
  font-size:18px;
  font-weight:700;
}

.card-id{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.badge{
  padding:5px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
}

.badge-ok{
  background:#0d3326;
  color:var(--green);
}

.badge-err{
  background:#3d1515;
  color:var(--red);
}

.badge-off{
  background:#1a2535;
  color:var(--muted);
}

/* METRICS */

.card-metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
}

.metric-box{
  background:var(--card2);
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.metric-val{
  font-size:44px;
  font-weight:900;
}

.metric-lbl{
  margin-top:6px;
  font-size:10px;
  color:var(--muted);
}

.card-metrics-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.metric-sm{
  background:var(--card2);
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.metric-sm-val{
  font-size:20px;
  font-weight:800;
}

.metric-sm-lbl{
  font-size:9px;
  color:var(--muted);
  margin-top:4px;
}

.card-foot{
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
}

@media(max-width:700px){
  .summary,
  .grid-wrap{
    padding-left:16px;
    padding-right:16px;
  }

  .device-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

  <div class="brand">
    Drip<span>Stop</span> IV Monitor
  </div>

  <div class="conn-pill pill-err" id="connPill">
    <span class="conn-dot"></span>
    <span id="connText">Connecting...</span>
  </div>

</div>

<!-- SUMMARY -->

<div class="summary" id="summary"></div>

<!-- GRID -->

<div class="grid-wrap">

  <div class="device-grid" id="grid">

    <div class="device-card" id="card_DEVICE_01">

      <div class="card-head">

        <div>
          <div class="card-name">Patient Monitor</div>
          <div class="card-id">DEVICE_01 · Bed 1</div>
        </div>

        <span class="badge badge-off" id="badge">
          OFFLINE
        </span>

      </div>

      <div class="card-metrics">

        <div class="metric-box">
          <div class="metric-val" id="rateVal">---</div>
          <div class="metric-lbl">Rate</div>
        </div>

        <div class="metric-box">
          <div class="metric-val" id="timeVal">---</div>
          <div class="metric-lbl">Time Left</div>
        </div>

      </div>

      <div class="card-metrics-row">

        <div class="metric-sm">
          <div class="metric-sm-val" id="setVal">---</div>
          <div class="metric-sm-lbl">Set</div>
        </div>

        <div class="metric-sm">
          <div class="metric-sm-val" id="dfVal">--</div>
          <div class="metric-sm-lbl">DF</div>
        </div>

        <div class="metric-sm">
          <div class="metric-sm-val" id="statusVal">---</div>
          <div class="metric-sm-lbl">Status</div>
        </div>

      </div>

      <div class="card-foot">

        <span id="footerStatus">
          No Signal
        </span>

        <span id="footerTime"></span>

      </div>

    </div>

  </div>

</div>

<script>

// ======================================================
// CONNECTION UI
// ======================================================

function setConn(ok){

  const pill = document.getElementById('connPill');
  const text = document.getElementById('connText');

  if(ok){

    pill.className = 'conn-pill pill-ok';
    text.textContent = 'Live · Connected';

  }else{

    pill.className = 'conn-pill pill-err';
    text.textContent = 'ESP32 Offline';
  }
}


// ======================================================
// RENDER SUMMARY
// ======================================================

function renderSummary(status){

  let running = 0;
  let alarms = 0;
  let offline = 0;

  if(status === 'RUNNING') running = 1;
  else if(status === 'OFFLINE') offline = 1;

  document.getElementById('summary').innerHTML = `

    <div class="sum-card">
      <div>
        <div class="sum-val" style="color:var(--green)">
          ${running}
        </div>
        <div class="sum-lbl">ACTIVE</div>
      </div>
    </div>

    <div class="sum-card">
      <div>
        <div class="sum-val" style="color:${alarms ? 'var(--red)' : 'var(--muted)'}">
          ${alarms}
        </div>
        <div class="sum-lbl">ALARMS</div>
      </div>
    </div>

    <div class="sum-card">
      <div>
        <div class="sum-val" style="color:var(--muted)">
          ${offline}
        </div>
        <div class="sum-lbl">OFFLINE</div>
      </div>
    </div>

    <div class="sum-card">
      <div>
        <div class="sum-val">
          1
        </div>
        <div class="sum-lbl">TOTAL</div>
      </div>
    </div>

  `;
}


// ======================================================
// TELEMETRY FETCH
// ======================================================

const ESP32_IP = window.location.hostname;


async function fetchTelemetry(){

  try{

    const response = await fetch(`http://${ESP32_IP}/telemetry`);

    const data = await response.json();

    setConn(true);

    document.getElementById('rateVal').textContent =
      data.RATE ?? '---';

    document.getElementById('timeVal').textContent =
      data.TIME ?? '---';

    document.getElementById('setVal').textContent =
      data.SET ?? '---';

    document.getElementById('dfVal').textContent =
      data.DF ?? '--';

    document.getElementById('statusVal').textContent =
      data.STATUS ?? '---';

    document.getElementById('footerStatus').textContent =
      data.STATUS ?? '---';

    document.getElementById('footerTime').textContent =
      new Date().toLocaleTimeString();

    // Badge

    const badge = document.getElementById('badge');

    if(data.STATUS === 'RUNNING'){

      badge.className = 'badge badge-ok';

    }else{

      badge.className = 'badge badge-off';
    }

    badge.textContent = data.STATUS;

    // Card Border

    const card = document.getElementById('card_DEVICE_01');

    if(data.STATUS === 'RUNNING'){

      card.className = 'device-card card-running';

    }else{

      card.className = 'device-card';
    }

    renderSummary(data.STATUS);

  }

  catch(e){

    console.log(e);

    setConn(false);

    renderSummary('OFFLINE');
  }
}


// ======================================================
// REFRESH LOOP
// ======================================================

fetchTelemetry();

setInterval(fetchTelemetry, 1000);

</script>

</body>
</html>
