<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DripStop Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{

  --bg:#f4f8fc;
  --card:#ffffff;
  --blue:#2196f3;
  --blue2:#64b5ff;
  --green:#20c777;
  --red:#ef5350;
  --yellow:#ffb300;

  --text:#1a2433;
  --muted:#6f8093;
  --border:#d8e2ee;

  --radius:22px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}


/* ===================================================== */
/* TOPBAR */
/* ===================================================== */

.topbar{

  height:74px;

  background:#fff;

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 28px;
}

.brand{

  font-size:26px;
  font-weight:900;
  letter-spacing:-1px;

  color:#fff;

  background:linear-gradient(90deg,var(--blue),var(--blue2));

  padding:8px 18px;

  border-radius:16px;

  box-shadow:0 8px 24px rgba(33,150,243,0.22);
}

.brand span{

  color:#ffffff;
}


/* ===================================================== */
/* MODE TOGGLE */
/* ===================================================== */

.mode-wrap{

  display:flex;
  align-items:center;
  gap:10px;
}

.mode-toggle{

  display:flex;

  background:#edf4fb;

  border-radius:999px;

  padding:4px;

  border:1px solid var(--border);
}

.mode-btn{

  border:none;

  padding:8px 16px;

  border-radius:999px;

  cursor:pointer;

  font-weight:700;

  font-size:12px;

  background:transparent;

  color:var(--muted);

  transition:0.2s;
}

.mode-btn.active{

  background:var(--blue);

  color:#fff;

  box-shadow:0 4px 14px rgba(33,150,243,0.3);
}


/* ===================================================== */
/* CONNECTION */
/* ===================================================== */

.conn{

  display:flex;
  align-items:center;
  gap:8px;

  padding:10px 16px;

  border-radius:999px;

  background:#fff;

  border:1px solid var(--border);

  font-size:12px;
  font-weight:700;
}

.dot{

  width:8px;
  height:8px;
  border-radius:50%;
}

.ok{

  color:var(--green);
}

.ok .dot{

  background:var(--green);
}

.err{

  color:var(--red);
}

.err .dot{

  background:var(--red);
}


/* ===================================================== */
/* SUMMARY */
/* ===================================================== */

.summary{

  display:flex;
  gap:14px;

  padding:24px 28px;
}

.sum-card{

  background:#fff;

  border:1px solid var(--border);

  border-radius:18px;

  padding:18px 22px;

  min-width:140px;

  box-shadow:0 4px 14px rgba(0,0,0,0.03);
}

.sum-val{

  font-size:30px;
  font-weight:900;
}

.sum-lbl{

  margin-top:4px;

  font-size:11px;

  color:var(--muted);

  font-weight:700;
}


/* ===================================================== */
/* DEVICE CARD */
/* ===================================================== */

.wrap{

  padding:0 28px 40px;
}

.card{

  background:#fff;

  border-radius:28px;

  border:2px solid #e3edf8;

  padding:28px;

  box-shadow:0 10px 30px rgba(0,0,0,0.05);

  max-width:520px;
}

.card.running{

  border-color:#a5e7c5;
}

.card-head{

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  margin-bottom:24px;
}

.title{

  font-size:24px;
  font-weight:800;
}

.sub{

  margin-top:5px;

  font-size:12px;

  color:var(--muted);
}

.badge{

  padding:8px 14px;

  border-radius:999px;

  font-size:11px;
  font-weight:800;
}

.badge.running{

  background:#e7fff3;
  color:var(--green);
}

.badge.paused{

  background:#fff4d9;
  color:var(--yellow);
}

.badge.offline{

  background:#f2f4f8;
  color:var(--muted);
}


/* ===================================================== */
/* BIG METRICS */
/* ===================================================== */

.metrics{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:16px;

  margin-bottom:18px;
}

.metric{

  background:#f5f9fe;

  border-radius:20px;

  padding:20px;

  text-align:center;
}

.metric-val{

  font-size:54px;

  font-weight:900;

  letter-spacing:-2px;
}

.metric-lbl{

  margin-top:6px;

  font-size:11px;

  color:var(--muted);

  font-weight:700;
}


/* ===================================================== */
/* SMALL METRICS */
/* ===================================================== */

.small{

  display:grid;

  grid-template-columns:1fr 1fr 1fr;

  gap:10px;
}

.small-box{

  background:#f5f9fe;

  border-radius:16px;

  padding:14px;

  text-align:center;
}

.small-val{

  font-size:22px;

  font-weight:800;
}

.small-lbl{

  margin-top:4px;

  font-size:10px;

  color:var(--muted);

  font-weight:700;
}


/* ===================================================== */
/* FOOT */
/* ===================================================== */

.foot{

  margin-top:22px;

  padding-top:16px;

  border-top:1px solid #edf2f8;

  display:flex;
  justify-content:space-between;

  color:var(--muted);

  font-size:12px;
}


/* ===================================================== */
/* IP BOX */
/* ===================================================== */

.ipbox{

  margin-bottom:18px;
}

.ipbox input{

  width:100%;

  padding:14px 16px;

  border-radius:16px;

  border:1px solid var(--border);

  outline:none;

  font-family:'Inter',sans-serif;
}

@media(max-width:700px){

  .summary{
    flex-wrap:wrap;
  }

  .metrics{
    grid-template-columns:1fr;
  }

  .small{
    grid-template-columns:1fr;
  }
}

</style>

</head>

<body>


<!-- ===================================================== -->
<!-- TOPBAR -->
<!-- ===================================================== -->

<div class="topbar">

  <div class="brand">
    Drip<span>Stop</span>
  </div>

  <div class="mode-wrap">

    <div class="mode-toggle">

      <button class="mode-btn active" id="liveBtn">
        LIVE
      </button>

      <button class="mode-btn" id="mockBtn">
        MOCK
      </button>

    </div>

    <div class="conn err" id="conn">

      <div class="dot"></div>

      <span id="connText">
        OFFLINE
      </span>

    </div>

  </div>

</div>


<!-- ===================================================== -->
<!-- SUMMARY -->
<!-- ===================================================== -->

<div class="summary">

  <div class="sum-card">
    <div class="sum-val" id="sumActive">0</div>
    <div class="sum-lbl">ACTIVE</div>
  </div>

  <div class="sum-card">
    <div class="sum-val" id="sumAlarm">0</div>
    <div class="sum-lbl">ALARMS</div>
  </div>

  <div class="sum-card">
    <div class="sum-val">1</div>
    <div class="sum-lbl">TOTAL DEVICES</div>
  </div>

</div>


<!-- ===================================================== -->
<!-- CARD -->
<!-- ===================================================== -->

<div class="wrap">

  <div class="card" id="card">

    <div class="ipbox">

      <input
        type="text"
        id="ipInput"
        placeholder="Enter ESP32 IP (example: 192.168.0.205)"
      >

    </div>

    <div class="card-head">

      <div>

        <div class="title">
          Infusion Monitor
        </div>

        <div class="sub">
          DEVICE_01 · Bed 1
        </div>

      </div>

      <div class="badge offline" id="badge">
        OFFLINE
      </div>

    </div>


    <div class="metrics">

      <div class="metric">

        <div class="metric-val" id="rate">
          ---
        </div>

        <div class="metric-lbl">
          RATE
        </div>

      </div>

      <div class="metric">

        <div class="metric-val" id="time">
          ---
        </div>

        <div class="metric-lbl">
          TIME LEFT
        </div>

      </div>

    </div>


    <div class="small">

      <div class="small-box">

        <div class="small-val" id="set">
          ---
        </div>

        <div class="small-lbl">
          SET RATE
        </div>

      </div>

      <div class="small-box">

        <div class="small-val" id="df">
          ---
        </div>

        <div class="small-lbl">
          DROP FACTOR
        </div>

      </div>

      <div class="small-box">

        <div class="small-val" id="status">
          ---
        </div>

        <div class="small-lbl">
          STATUS
        </div>

      </div>

    </div>


    <div class="foot">

      <span id="footerStatus">
        Waiting...
      </span>

      <span id="footerTime">
        --
      </span>

    </div>

  </div>

</div>


<script>


// =====================================================
// STATE
// =====================================================

let mode = "live";

let mockTimer = null;


// =====================================================
// MODE BUTTONS
// =====================================================

const liveBtn = document.getElementById('liveBtn');
const mockBtn = document.getElementById('mockBtn');

liveBtn.onclick = () => {

  mode = "live";

  liveBtn.classList.add('active');
  mockBtn.classList.remove('active');

  stopMock();
};

mockBtn.onclick = () => {

  mode = "mock";

  mockBtn.classList.add('active');
  liveBtn.classList.remove('active');

  startMock();
};


// =====================================================
// CONNECTION UI
// =====================================================

function setConn(ok){

  const conn = document.getElementById('conn');

  const text = document.getElementById('connText');

  if(ok){

    conn.className = 'conn ok';

    text.innerText = 'LIVE';

  }else{

    conn.className = 'conn err';

    text.innerText = 'OFFLINE';
  }
}


// =====================================================
// UPDATE UI
// =====================================================

function updateUI(data){

  document.getElementById('rate').innerText = data.RATE;
  document.getElementById('time').innerText = data.TIME;

  document.getElementById('set').innerText = data.SET;
  document.getElementById('df').innerText = data.DF;

  document.getElementById('status').innerText = data.STATUS;

  document.getElementById('footerStatus').innerText =
    data.STATUS;

  document.getElementById('footerTime').innerText =
    new Date().toLocaleTimeString();

  const badge = document.getElementById('badge');

  const card = document.getElementById('card');

  if(data.STATUS === 'RUNNING'){

    badge.className = 'badge running';

    badge.innerText = 'RUNNING';

    card.className = 'card running';

    document.getElementById('sumActive').innerText = '1';

  }else{

    badge.className = 'badge paused';

    badge.innerText = data.STATUS;

    card.className = 'card';

    document.getElementById('sumActive').innerText = '0';
  }
}


// =====================================================
// LIVE FETCH
// =====================================================

async function fetchTelemetry(){

  if(mode !== 'live') return;

  const ip = document.getElementById('ipInput').value.trim();

  if(!ip) return;

  try{

    const response =
      await fetch(`http://${ip}/telemetry?t=${Date.now()}`);

    const data = await response.json();

    setConn(true);

    updateUI(data);

  }

  catch(e){

    console.log(e);

    setConn(false);
  }
}

setInterval(fetchTelemetry,1000);


// =====================================================
// MOCK MODE
// =====================================================

function startMock(){

  stopMock();

  mockTimer = setInterval(()=>{

    const rate = Math.floor(Math.random()*60)+30;

    const time = Math.floor(Math.random()*120);

    const statuses = ['RUNNING','PAUSED'];

    const status =
      statuses[Math.floor(Math.random()*statuses.length)];

    updateUI({

      RATE:rate,
      SET:50,
      STATUS:status,
      TIME:time,
      DF:20

    });

    setConn(true);

  },1000);
}

function stopMock(){

  if(mockTimer){

    clearInterval(mockTimer);

    mockTimer = null;
  }
}

</script>

</body>
</html>
